```yaml
name: Build Friday Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Friday project
        run: |
          unzip -o FridayAssistantNext11.zip -d project
          cp -a project/. .
          rm -rf project

      - name: Download offline speech models
        run: |
          mkdir -p app/src/main/assets/model-en
          mkdir -p app/src/main/assets/model-hi

          curl -L --fail --retry 3 \
            -o /tmp/model-en.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip

          curl -L --fail --retry 3 \
            -o /tmp/model-hi.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip

          mkdir -p /tmp/model-en /tmp/model-hi

          unzip -q /tmp/model-en.zip -d /tmp/model-en
          unzip -q /tmp/model-hi.zip -d /tmp/model-hi

          cp -a /tmp/model-en/vosk-model-small-en-us-0.15/. app/src/main/assets/model-en/
          cp -a /tmp/model-hi/vosk-model-small-hi-0.22/. app/src/main/assets/model-hi/

          test -f app/src/main/assets/model-en/conf/model.conf
          test -f app/src/main/assets/model-hi/conf/model.conf

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Friday-offline-online-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
```
