
name: Build Nearby Wi-Fi Connect APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract Android project ZIP
        run: |
          set -eu
          mkdir -p extracted

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found in repository root."
            exit 1
          fi

          unzip -oq "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f \
            -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle settings file not found inside ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      
      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Copy APK to upload folder
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" output/NearbyWifiConnect-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NearbyWifiConnect-debug-apk
          path: output/NearbyWifiConnect-debug.apk
          if-no-files-found: error
          retention-days: 7
